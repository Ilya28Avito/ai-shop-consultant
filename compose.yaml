services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env_robust_23
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # ДЗ 5.6, шаг 5 — внутри docker-сети сервисы видят друг друга по имени
      # сервиса, а не localhost (та же логика, что уже есть для REDIS_URL/
      # QDRANT_URL выше). Вне compose (локальный запуск через uvicorn на
      # хосте) в .env_robust_23 нужен http://localhost:6006.
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      # ДЗ 6.4 — Postgres для checkpointer'а LangGraph (AGENT_CHECKPOINTER=postgres
      # в docker-режиме; локально на хосте по умолчанию sqlite — см. .env.example).
      # Postgres в этом проекте до этого ДЗ не было ни в compose, ни в .env —
      # заводится с нуля здесь, а не переиспользуется из более раннего блока.
      POSTGRES_URI: postgresql://ai_shop:ai_shop@postgres:5432/ai_shop
      AGENT_CHECKPOINTER: postgres
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ДЗ 5.6, шаг 5 — Phoenix: UI + приём трейсов по OTLP/HTTP на том же порту
  # (v1/traces под 6006), плюс OTLP/gRPC на 4317 (не используем — экспортер
  # в app/observability/tracing.py настроен на HTTP, но порт пробрасываем
  # на случай, если пригодится другой клиент).
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    restart: unless-stopped

  # ДЗ 6.4 — Postgres для production-режима checkpointer'а LangGraph
  # (langgraph-checkpoint-postgres, таблицы checkpoints/checkpoint_writes/
  # checkpoint_blobs/checkpoint_migrations создаются один раз через
  # await checkpointer.setup() при старте FastAPI, не Alembic'ом — в
  # проекте нет ORM-моделей/Alembic, поэтому пункт про include_name из
  # задания здесь неприменим, это отдельно оговорено в отчёте).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_shop
      POSTGRES_PASSWORD: ai_shop
      POSTGRES_DB: ai_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_shop -d ai_shop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data: {}
  qdrant_storage: {}
  phoenix_data: {}
  postgres_data: {}
